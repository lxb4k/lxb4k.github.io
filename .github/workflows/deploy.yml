name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - v5
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # вся история нужна Quartz для дат изменения страниц

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Cache Quartz plugins
        uses: actions/cache@v4
        with:
          path: .quartz/plugins
          key: quartz-plugins-${{ hashFiles('package-lock.json', 'quartz.lock.json') }}

      - name: Install Quartz plugins
        run: npx quartz plugin install

      - name: Build Quartz
        run: npx quartz build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  backup:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v5
          fetch-depth: 0

      - name: Download published site
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/site-artifact

      - name: Save last working copy
        run: |
          mkdir -p "${RUNNER_TEMP}/site-copy"
          tar -xf "${RUNNER_TEMP}/site-artifact/artifact.tar" -C "${RUNNER_TEMP}/site-copy"
          rm -rf docs
          mkdir docs
          cp -a "${RUNNER_TEMP}/site-copy/." docs/
          touch docs/.nojekyll
          git add -A docs
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Обновить резервную копию сайта'
          git push origin HEAD:v5
